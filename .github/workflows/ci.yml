name: CaptionForge CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

defaults:
  run:
    shell: pwsh

jobs:
  tests:
    name: Compilar y probar en Windows
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Instalar FFmpeg para las pruebas
        run: ./.github/scripts/Install-TestFfmpeg.ps1

      - name: Compilar Desktop y ejecutar pruebas
        run: ./.github/scripts/Verify-CaptionForge.ps1

      - name: Conservar resultados y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results/**
          if-no-files-found: warn
          retention-days: 14
